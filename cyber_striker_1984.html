<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CYBER STRIKER 1984</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050508;
      font-family: 'Courier New', Courier, monospace;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(5, 5, 8, 0.85);
      color: #fff;
      z-index: 10;
      transition: opacity 0.3s;
    }
    .hidden {
      display: none !important;
    }
    h1 {
      font-size: 2.8rem;
      text-align: center;
      color: #00ffcc;
      text-shadow: 0 0 10px #00ffcc, 0 0 20px #00ffcc, 0 0 40px #ff0077;
      margin-bottom: 25px;
      letter-spacing: 4px;
    }
    .start-btn {
      padding: 18px 45px;
      font-size: 1.4rem;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(45deg, #ff0077, #7900ff);
      border: 2px solid #00ffcc;
      border-radius: 40px;
      box-shadow: 0 0 15px #ff0077, inset 0 0 10px #00ffcc;
      cursor: pointer;
      letter-spacing: 2px;
    }
    .high-score {
      margin-top: 20px;
      font-size: 1.1rem;
      color: #ff0077;
      letter-spacing: 2px;
      text-shadow: 0 0 8px #ff0077;
    }
    #touch-controls {
      position: absolute;
      bottom: 20px;
      left: 0;
      width: 100%;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      z-index: 5;
    }
    .t-btn {
      pointer-events: auto;
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: rgba(255, 0, 119, 0.25);
      border: 2px solid #ff0077;
      color: #fff;
      font-size: 1.2rem;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 12px #ff0077;
    }
    .t-btn:active {
      background: rgba(255, 0, 119, 0.6);
    }
    #autofire-btn {
      border-color: #00ffcc;
      background: rgba(0, 255, 204, 0.25);
      box-shadow: 0 0 12px #00ffcc;
      font-size: 0.8rem;
    }
    #autofire-btn.active {
      background: rgba(0, 255, 204, 0.7);
      color: #000;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="canvas"></canvas>

    <div id="menu-overlay" class="overlay">
      <h1>CYBER STRIKER<br>1984</h1>
      <button id="start-btn" class="start-btn">PRESS START</button>
      <div id="high-score-display" class="high-score">HIGH SCORE: 0</div>
    </div>

    <div id="touch-controls">
      <div id="autofire-btn" class="t-btn active">AUTO</div>
      <div id="bomb-btn" class="t-btn">💣</div>
    </div>
  </div>

  <script>
    class SoundEngine {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playShoot() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(800, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.1);
      }
      playExplosion() {
        if (!this.ctx) return;
        const bufferSize = this.ctx.sampleRate * 0.2;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(1000, this.ctx.currentTime);
        filter.frequency.linearRampToValueAtTime(100, this.ctx.currentTime + 0.2);
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start();
      }
      playPowerup() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1200, this.ctx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.2);
      }
    }

    const sound = new SoundEngine();

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const menuOverlay = document.getElementById('menu-overlay');
    const startBtn = document.getElementById('start-btn');
    const highScoreDisplay = document.getElementById('high-score-display');
    const bombBtn = document.getElementById('bomb-btn');
    const autofireBtn = document.getElementById('autofire-btn');

    let dpr = window.devicePixelRatio || 1;
    let width = window.innerWidth;
    let height = window.innerHeight;

    function resizeCanvas() {
      dpr = window.devicePixelRatio || 1;
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let isPlaying = false;
    let score = 0;
    let highScore = localStorage.getItem('cs1984_highscore') || 0;
    highScoreDisplay.textContent = `HIGH SCORE: ${highScore}`;
    let level = 1;
    let autofire = true;

    const player = {
      x: width / 2,
      y: height - 100,
      radius: 18,
      speed: 7,
      lives: 3,
      bombs: 2,
      tripleShot: false,
      tripleShotTimer: 0,
      rapidFire: false,
      rapidFireTimer: 0,
      shield: false,
      shieldTimer: 0,
      lastShoot: 0
    };

    let playerBullets = [];
    let enemyBullets = [];
    let enemies = [];
    let powerups = [];
    let particles = [];
    let stars = [];

    for (let i = 0; i < 80; i++) {
      stars.push({
        x: Math.random() * width,
        y: Math.random() * height,
        speed: 1 + Math.random() * 3,
        size: 1 + Math.random() * 2
      });
    }

    let isTouching = false;
    let lastTouchX = 0;
    let lastTouchY = 0;

    window.addEventListener('touchstart', (e) => {
      if (!isPlaying) return;
      const t = e.touches[0];
      isTouching = true;
      lastTouchX = t.clientX;
      lastTouchY = t.clientY;
    });

    window.addEventListener('touchmove', (e) => {
      if (!isPlaying || !isTouching) return;
      const t = e.touches[0];
      const dx = t.clientX - lastTouchX;
      const dy = t.clientY - lastTouchY;
      player.x = Math.max(player.radius, Math.min(width - player.radius, player.x + dx));
      player.y = Math.max(player.radius, Math.min(height - player.radius, player.y + dy));
      lastTouchX = t.clientX;
      lastTouchY = t.clientY;
    });

    window.addEventListener('touchend', () => {
      isTouching = false;
    });

    const keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    bombBtn.addEventListener('touchstart', triggerBomb);
    bombBtn.addEventListener('click', triggerBomb);

    autofireBtn.addEventListener('click', toggleAutofire);
    autofireBtn.addEventListener('touchstart', toggleAutofire);

    function toggleAutofire(e) {
      if (e) e.preventDefault();
      autofire = !autofire;
      autofireBtn.classList.toggle('active', autofire);
    }

    function triggerBomb(e) {
      if (e) e.preventDefault();
      if (!isPlaying || player.bombs <= 0) return;
      player.bombs--;
      enemyBullets = [];
      enemies.forEach(enemy => {
        createExplosion(enemy.x, enemy.y, '#ff0077', 15);
      });
      enemies = [];
      sound.playExplosion();
    }

    let enemySpawnTimer = 0;

    function startGame() {
      sound.init();
      score = 0;
      level = 1;
      player.lives = 3;
      player.bombs = 2;
      player.x = width / 2;
      player.y = height - 120;
      player.tripleShot = false;
      player.rapidFire = false;
      player.shield = false;
      playerBullets = [];
      enemyBullets = [];
      enemies = [];
      powerups = [];
      particles = [];
      isPlaying = true;
      menuOverlay.classList.add('hidden');
    }

    function gameOver() {
      isPlaying = false;
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('cs1984_highscore', highScore);
        highScoreDisplay.textContent = `HIGH SCORE: ${highScore}`;
      }
      menuOverlay.classList.remove('hidden');
    }

    function handleStart(e) {
      e.preventDefault();
      if (!isPlaying) startGame();
    }
    startBtn.addEventListener('click', handleStart);
    startBtn.addEventListener('touchend', handleStart);

    function spawnEnemy() {
      // PROGRESIÓN DE NIVEL LIGERAMENTE MÁS RÁPIDA (cada 350 puntos en lugar de 500)
      level = Math.floor(score / 350) + 1;

      const spawnRate = Math.max(20, 65 - level * 8);
      enemySpawnTimer++;
      if (enemySpawnTimer >= spawnRate) {
        enemySpawnTimer = 0;
        const types = ['basic', 'fast', 'heavy'];
        let type = types[Math.floor(Math.random() * types.length)];
        
        if (level >= 3 && Math.random() < 0.45) type = 'heavy';

        let hp = 1;
        let speed = 2.2 + Math.random() * 2 + level * 0.4;
        let color = '#ff0055';
        let size = 18;

        if (type === 'fast') {
          speed += 2.2;
          color = '#ffcc00';
          size = 14;
        } else if (type === 'heavy') {
          hp = 2 + Math.floor(level * 0.6);
          speed = 1.6;
          color = '#7900ff';
          size = 26;
        }

        enemies.push({
          x: Math.random() * (width - 40) + 20,
          y: -30,
          type: type,
          hp: hp,
          speed: speed,
          color: color,
          size: size,
          lastShoot: 0
        });
      }
    }

    function createExplosion(x, y, color, count = 10) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * 8,
          vy: (Math.random() - 0.5) * 8,
          color: color,
          size: Math.random() * 3 + 1,
          life: 1
        });
      }
    }

    function shoot() {
      const now = Date.now();
      const fireRate = player.rapidFire ? 100 : 200;
      if (now - player.lastShoot > fireRate) {
        player.lastShoot = now;
        sound.playShoot();

        if (player.tripleShot) {
          playerBullets.push({ x: player.x, y: player.y - 20, vx: 0, vy: -12 });
          playerBullets.push({ x: player.x - 10, y: player.y - 15, vx: -3, vy: -11 });
          playerBullets.push({ x: player.x + 10, y: player.y - 15, vx: 3, vy: -11 });
        } else {
          playerBullets.push({ x: player.x, y: player.y - 20, vx: 0, vy: -12 });
        }
      }
    }

    function update() {
      if (!isPlaying) return;

      if (keys['ArrowLeft'] || keys['KeyA']) player.x = Math.max(player.radius, player.x - player.speed);
      if (keys['ArrowRight'] || keys['KeyD']) player.x = Math.min(width - player.radius, player.x + player.speed);
      if (keys['ArrowUp'] || keys['KeyW']) player.y = Math.max(player.radius, player.y - player.speed);
      if (keys['ArrowDown'] || keys['KeyS']) player.y = Math.min(height - player.radius, player.y + player.speed);

      if (autofire || keys['Space'] || keys['KeyZ']) {
        shoot();
      }

      if (player.tripleShotTimer > 0) {
        player.tripleShotTimer--;
        if (player.tripleShotTimer <= 0) player.tripleShot = false;
      }
      if (player.rapidFireTimer > 0) {
        player.rapidFireTimer--;
        if (player.rapidFireTimer <= 0) player.rapidFire = false;
      }
      if (player.shieldTimer > 0) {
        player.shieldTimer--;
        if (player.shieldTimer <= 0) player.shield = false;
      }

      playerBullets.forEach((b, index) => {
        b.x += b.vx;
        b.y += b.vy;
        if (b.y < -10 || b.x < 0 || b.x > width) playerBullets.splice(index, 1);
      });

      enemyBullets.forEach((b, index) => {
        b.x += b.vx;
        b.y += b.vy;
        if (b.y > height + 10 || b.x < 0 || b.x > width) enemyBullets.splice(index, 1);

        const dist = Math.hypot(b.x - player.x, b.y - player.y);
        if (dist < player.radius + 4) {
          enemyBullets.splice(index, 1);
          if (player.shield) return;
          createExplosion(player.x, player.y, '#00ffcc', 20);
          sound.playExplosion();
          player.lives--;
          if (player.lives <= 0) gameOver();
        }
      });

      spawnEnemy();
      enemies.forEach((enemy, index) => {
        enemy.y += enemy.speed;

        const shootChance = 0.008 + level * 0.004;
        if (Math.random() < shootChance && enemy.y > 50 && enemy.y < height - 200) {
          const angle = Math.atan2(player.y - enemy.y, player.x - enemy.x);
          const bSpeed = 4.5 + level * 0.45;
          enemyBullets.push({
            x: enemy.x,
            y: enemy.y,
            vx: Math.cos(angle) * bSpeed,
            vy: Math.sin(angle) * bSpeed
          });

          if (level >= 3) {
            enemyBullets.push({
              x: enemy.x,
              y: enemy.y,
              vx: Math.cos(angle - 0.35) * bSpeed,
              vy: Math.sin(angle - 0.35) * bSpeed
            });
            enemyBullets.push({
              x: enemy.x,
              y: enemy.y,
              vx: Math.cos(angle + 0.35) * bSpeed,
              vy: Math.sin(angle + 0.35) * bSpeed
            });
          }
        }

        playerBullets.forEach((pb, pbIndex) => {
          const dist = Math.hypot(pb.x - enemy.x, pb.y - enemy.y);
          if (dist < enemy.size + 6) {
            playerBullets.splice(pbIndex, 1);
            enemy.hp--;
            createExplosion(pb.x, pb.y, '#00ffcc', 4);
            if (enemy.hp <= 0) {
              createExplosion(enemy.x, enemy.y, enemy.color, 15);
              sound.playExplosion();
              score += enemy.type === 'heavy' ? 30 : 10;

              if (Math.random() < 0.12) {
                const pTypes = ['TRIPLE', 'RAPID', 'SHIELD'];
                powerups.push({
                  x: enemy.x,
                  y: enemy.y,
                  type: pTypes[Math.floor(Math.random() * pTypes.length)]
                });
              }

              enemies.splice(index, 1);
            }
          }
        });

        const playerDist = Math.hypot(enemy.x - player.x, enemy.y - player.y);
        if (playerDist < enemy.size + player.radius) {
          enemies.splice(index, 1);
          createExplosion(enemy.x, enemy.y, enemy.color, 15);
          if (!player.shield) {
            player.lives--;
            createExplosion(player.x, player.y, '#00ffcc', 20);
            sound.playExplosion();
            if (player.lives <= 0) gameOver();
          }
        }

        if (enemy.y > height + 40) enemies.splice(index, 1);
      });

      powerups.forEach((p, index) => {
        p.y += 2;
        const dist = Math.hypot(p.x - player.x, p.y - player.y);
        if (dist < player.radius + 15) {
          sound.playPowerup();
          if (p.type === 'TRIPLE') { player.tripleShot = true; player.tripleShotTimer = 400; }
          if (p.type === 'RAPID') { player.rapidFire = true; player.rapidFireTimer = 400; }
          if (p.type === 'SHIELD') { player.shield = true; player.shieldTimer = 500; }
          powerups.splice(index, 1);
        }
        if (p.y > height + 20) powerups.splice(index, 1);
      });

      particles.forEach((p, index) => {
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.03;
        if (p.life <= 0) particles.splice(index, 1);
      });

      stars.forEach(star => {
        star.y += star.speed;
        if (star.y > height) {
          star.y = 0;
          star.x = Math.random() * width;
        }
      });
    }

    function render() {
      ctx.clearRect(0, 0, width, height);

      ctx.fillStyle = '#ffffff';
      stars.forEach(star => {
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
        ctx.fill();
      });

      if (isPlaying) {
        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#00ffcc';
        ctx.strokeStyle = '#00ffcc';
        ctx.fillStyle = '#ff0077';
        ctx.lineWidth = 3;

        ctx.beginPath();
        ctx.moveTo(0, -player.radius - 5);
        ctx.lineTo(-player.radius, player.radius);
        ctx.lineTo(0, player.radius - 5);
        ctx.lineTo(player.radius, player.radius);
        ctx.closePath();
        ctx.stroke();
        ctx.fill();

        ctx.fillStyle = '#ffcc00';
        ctx.beginPath();
        ctx.arc(0, -2, 4, 0, Math.PI * 2);
        ctx.fill();

        if (player.shield) {
          ctx.strokeStyle = '#00aaff';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(0, 0, player.radius + 10, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.restore();

        ctx.fillStyle = '#00ffcc';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#00ffcc';
        playerBullets.forEach(b => {
          ctx.beginPath();
          ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
          ctx.fill();
        });

        enemies.forEach(enemy => {
          ctx.save();
          ctx.translate(enemy.x, enemy.y);
          ctx.shadowBlur = 10;
          ctx.shadowColor = enemy.color;
          ctx.strokeStyle = enemy.color;
          ctx.lineWidth = 2.5;

          ctx.beginPath();
          ctx.moveTo(0, enemy.size);
          ctx.lineTo(-enemy.size, -enemy.size);
          ctx.lineTo(enemy.size, -enemy.size);
          ctx.closePath();
          ctx.stroke();
          ctx.restore();
        });

        ctx.fillStyle = '#ff0055';
        ctx.shadowBlur = 8;
        ctx.shadowColor = '#ff0055';
        enemyBullets.forEach(b => {
          ctx.beginPath();
          ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
          ctx.fill();
        });

        powerups.forEach(p => {
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.shadowBlur = 12;
          ctx.shadowColor = '#ffcc00';
          ctx.fillStyle = '#ffcc00';
          ctx.font = 'bold 12px Courier New';
          ctx.textAlign = 'center';
          ctx.fillText(p.type[0], 0, 4);
          ctx.strokeStyle = '#ffcc00';
          ctx.beginPath();
          ctx.arc(0, 0, 12, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        });

        particles.forEach(p => {
          ctx.fillStyle = p.color;
          ctx.globalAlpha = p.life;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;
        });

        ctx.shadowBlur = 0;
        ctx.fillStyle = '#00ffcc';
        ctx.font = 'bold 16px Courier New';
        ctx.fillText(`SCORE: ${score}`, 20, 30);
        ctx.fillText(`LEVEL: ${level}`, 20, 50);
        ctx.fillText(`LIVES: ${'♥'.repeat(player.lives)}`, 20, 70);
        ctx.fillText(`BOMBS: ${'💣'.repeat(player.bombs)}`, 20, 90);
      }
    }

    function gameLoop() {
      update();
      render();
      requestAnimationFrame(gameLoop);
    }
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
